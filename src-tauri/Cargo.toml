[package]
name = "omega"
version = "0.1.0"
description = "Omega: conversación local y verificable con los documentos de un negocio"
authors = ["Omega"]
edition = "2024"
default-run = "omega"

[lib]
name = "omega_core"
crate-type = ["rlib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
anyhow = "1"
calamine = "0.30"
csv = "1"
libc = "0.2"
pdf-extract = "0.10"
regex = "1"
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
thiserror = "2"
unicode-normalization = "0.1"
walkdir = "2"
zip = { version = "5", default-features = false, features = ["deflate"] }

[dev-dependencies]
tempfile = "3"

# `tauri dev` compila las dependencias en perfil de desarrollo: sin esto, el
# arranque paga sin optimizar el PDF, el ZIP y SQLite, que es casi todo el
# tiempo de un ciclo de prueba en la aplicación.
[profile.dev.package."*"]
opt-level = 3
